<div class="row">
    <div class="col-6">
        <div class="mb-3">
            <form action="">
                <h4>Punto 1</h4>
                <div class="form-group pt-2">
                    <label for="x1" class="form-label">Coordenada X1:</label>
                    <input [(ngModel)]="x1" type="number" name="x1" class="form-control" id="x1" placeholder="Ingresa X1">
                </div>
                <div class="form-group pt-2">
                    <label for="y1" class="form-label">Coordenada Y1:</label>
                    <input [(ngModel)]="y1" type="number" name="y1" class="form-control" id="y1" placeholder="Ingresa Y1">
                </div>

                <h4 class="pt-4">Punto 2</h4>
                <div class="form-group pt-2">
                    <label for="x2" class="form-label">Coordenada X2:</label>
                    <input [(ngModel)]="x2" type="number" name="x2" class="form-control" id="x2" placeholder="Ingresa X2">
                </div>
                <div class="form-group pt-2">
                    <label for="y2" class="form-label">Coordenada Y2:</label>
                    <input [(ngModel)]="y2" type="number" name="y2" class="form-control" id="y2" placeholder="Ingresa Y2">
                </div>
     
                <br/>
                <button (click)="calcularDistancia()" type="button" class="btn btn-primary m-1">Calcular Distancia</button>
            </form>
        </div>
    </div>
    
    <div class="col-6">
        <h2>Distancia: {{resultado | number:'1.2-2'}}</h2> 
    </div>
</div>
