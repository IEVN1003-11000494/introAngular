<div class="col-6">
    <div class="mb-3">
        <form action="">
            <div class="form-group pt-4">
                <label for="num1" class="form-label">Numero 1:</label>
                <input [(ngModel)]="num1"
                type="text" name="num1" class="form-control" id="num1" placeholder="Ingresa Numero 1">
            </div>
            <div class="form-group pt-4">
                <label for="num2" class="form-label">Numero 2:</label>
                <input [(ngModel)]="num2"
                type="text" name="num2" class="form-control" id="num2" placeholder="Ingresa Numero 2">
            </div>
            <br/>
           <!--  <button (click)="sumar()" type="button" class="btn btn-primary m-1">Sumar</button>
            <button (click)="restar()" type="button" class="btn btn-primary m-1">Restar</button>
            <button (click)="multiplicar()" type="button" class="btn btn-primary m-1">Multiplicar</button>
            <button (click)="dividir()" type="button" class="btn btn-primary m-1">Dividir</button> -->
 
            
        <div class="form-group pt-4">
        <label class="form-label mb-2">Operacion a realizar:</label>
        <div>
        <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="operacion" id="opSumar" value="sumar" [(ngModel)]="operacion">
        <label class="form-check-label" for="opSumar">Sumar</label>
        </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="operacion" id="opRestar" value="restar" [(ngModel)]="operacion">
      <label class="form-check-label" for="opRestar">Restar</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="operacion" id="opMultiplicar" value="multiplicar" [(ngModel)]="operacion">
      <label class="form-check-label" for="opMultiplicar">Multiplicar</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="operacion" id="opDividir" value="dividir" [(ngModel)]="operacion">
      <label class="form-check-label" for="opDividir">Dividir</label>
    </div>
  </div>
</div>
 
<br/>
 
<button (click)="calcular()" type="button" class="btn btn-primary m-1">Calcular</button>
        </form>
    </div>
</div>
<div class="col-6">
    <h2>Resultado: {{resultado}}</h2>
</div>
